[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bocabind"
version = "0.1.1"
description = "Structural classification of ligand-specific binding-site accessibility from protein-ligand complexes."
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
authors = [{name = "Tonina Dynamics"}]
keywords = ["structural-biology", "drug-discovery", "protein-ligand", "steric-clash"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
dev = ["bocabind[test]", "ruff>=0.6", "mypy>=1.10", "build>=1.2"]

[project.scripts]
bocabind = "bocabind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
